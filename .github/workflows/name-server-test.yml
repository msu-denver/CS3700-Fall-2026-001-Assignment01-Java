name: A0 Java Service Discovery Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Pyro5
      run: |
        python -m pip install --upgrade pip
        pip install Pyro5==5.17

    - name: Lint with Checkstyle
      run: |
        # Download Checkstyle if not already available
        if [ ! -f checkstyle.jar ]; then
          curl -L -o checkstyle.jar https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.4/checkstyle-10.12.4-all.jar
        fi
        java -jar checkstyle.jar -c google_checks.xml src/ || true
      continue-on-error: true

    - name: Compile Java code
      run: |
        javac src/*.java

    - name: Check for JUnit tests
      id: check_tests
      run: |
        if [ -d test ] && find test -name "*Test.java" | grep -q .; then
          echo "has_tests=true" >> $GITHUB_OUTPUT
        else
          echo "has_tests=false" >> $GITHUB_OUTPUT
        fi

    - name: Download JaCoCo for coverage
      run: |
        if [ ! -d jacoco ]; then
          curl -k -L -o jacoco.zip https://github.com/jacoco/jacoco/releases/download/v0.8.10/jacoco-0.8.10.zip
          unzip -q jacoco.zip -d jacoco
        fi

    - name: Compile JUnit tests
      if: steps.check_tests.outputs.has_tests == 'true'
      run: |
        if [ -d "test" ]; then
          javac -cp "src:test" test/*.java src/*.java 2>&1 || echo "Note: Test compilation may require JUnit libraries"
        fi
      continue-on-error: true

    - name: Generate JaCoCo coverage report
      run: |
        if [ -f jacoco/jacococli.jar ] && [ -f jacoco.exec ]; then
          java -jar jacoco/jacococli.jar report jacoco.exec --classfiles src/ --sourcefiles . --html coverage/ 2>/dev/null || true
        fi
      continue-on-error: true

    - name: Upload JaCoCo coverage (if available)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: java-a0-coverage
        path: coverage/
      continue-on-error: true

    - name: Start Pyro5 name server in background
      run: |
        nohup python -m Pyro5.nameserver > /tmp/nameserver.log 2>&1 &
        NS_PID=$!
        echo "Nameserver PID: $NS_PID"
        sleep 5

        # Verify the process is running
        if ! ps -p $NS_PID > /dev/null; then
          echo "✗ Nameserver failed to start"
          cat /tmp/nameserver.log
          exit 1
        fi

        # Wait for the nameserver to be ready using Pyro5 API
        for i in {1..10}; do
          if python -c "import Pyro5.api; ns = Pyro5.api.locate_ns('localhost', 9090); print('Nameserver ready')" 2>/dev/null; then
            echo "✓ Nameserver is ready"
            break
          fi
          if [ $i -eq 10 ]; then
            echo "✗ Nameserver not ready after 10 attempts"
            cat /tmp/nameserver.log
            exit 1
          fi
          sleep 1
        done

    - name: Run service discovery client (grading hook)
      run: |
        java -cp src ServiceDiscoveryClient 2>&1
      timeout-minutes: 1

    - name: Clean up
      if: always()
      run: |
        pkill -f "Pyro5.nameserver" || pkill -f "python.*Pyro5" || true
        sleep 1
